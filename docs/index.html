<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HowlForge</title>
<script>
(async () => {
  const [a, b] = await Promise.all([
    fetch('index.part-a.html').then(r => r.text()),
    fetch('index.part-b.html').then(r => r.text()),
  ]);
  document.open();
  document.write(a + b);
  document.close();
})();
</script>
</head>
<body>
<p>Loading HowlForge…</p>
</body>
</html>
