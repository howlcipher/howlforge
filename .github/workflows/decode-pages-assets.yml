name: Decode Pages Assets
on:
  push:
    branches: ["cursor/howlforge-pages-4ad1"]
    paths:
      - "docs/*.zlib.b64"
      - "docs/*.zlib.b64.part*"
      - ".github/workflows/decode-pages-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode-pages-assets-howlforge
  cancel-in-progress: true
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore static docs/index.html
        run: |
          python3 <<'PY'
          import pathlib, re, subprocess, urllib.request
          docs = pathlib.Path("docs")
          # Prefer assembling zlib urlsafe-b64 parts when present and valid
          restored = None
          parts = sorted(
              docs.glob("index.html.zlib.b64.part*"),
              key=lambda p: int(re.search(r"\.part(\d+)$", p.name).group(1)),
          )
          if parts:
              import base64, zlib
              assembled = "".join("".join(p.read_text().split()) for p in parts)
              try:
                  data = zlib.decompress(base64.urlsafe_b64decode(assembled))
                  if len(data) >= 30000 and b"HowlForge" in data and b"Your AI agents" in data:
                      restored = data
                      print(f"decoded from {len(parts)} parts ({len(data)} bytes)")
                  else:
                      print("parts decoded but failed verification; falling back")
              except Exception as e:
                  print(f"parts decode failed ({e}); falling back")

          if restored is None:
              # Last known good full static page
              url = (
                  "https://raw.githubusercontent.com/howlcipher/howlforge/"
                  "ced2cf6110985c19ab543a640df0f0f54507c3ff/docs/index.html"
              )
              with urllib.request.urlopen(url, timeout=60) as resp:
                  restored = resp.read()
              print(f"fetched last-good commit content ({len(restored)} bytes)")

          text = restored.decode("utf-8")
          # Optional: drop unpublished favicon.png alternate link
          text = text.replace(
              '    <link rel="alternate icon" type="image/png" href="favicon.png">\n',
              "",
          )
          data = text.encode("utf-8")
          if len(data) < 30000 or "HowlForge" not in text or "Your AI agents" not in text:
              raise SystemExit("restored HTML failed verification")
          (docs / "index.html").write_bytes(data)
          print(f"wrote docs/index.html ({len(data)} bytes)")

          for p in docs.glob("index.html.zlib.b64*"):
              p.unlink()
              print("deleted", p)
          wf = pathlib.Path(".github/workflows/decode-pages-assets.yml")
          if wf.is_file():
              wf.unlink()
              print("deleted", wf)
          PY
      - name: Commit restored index.html and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/index.html docs/index.html.zlib.b64* .github/workflows/decode-pages-assets.yml || true
          git add -u docs/ .github/workflows/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git status
            git commit -m "Restore static docs/index.html for HowlForge Pages"
            git push
          fi
