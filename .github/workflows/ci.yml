name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        run: go test -race ./...

      - name: Build
        run: go build -o build/howlforge ./cmd/howlforge

      - name: Validate the shipped configuration
        run: ./build/howlforge --config config validate

      - name: Validate the shipped handoff example
        run: ./build/howlforge handoff validate examples/handoffs/HOWL-0042

      - name: Confirm no dependency creep
        run: |
          # HowlForge deliberately carries exactly one dependency. A new one is
          # an architectural decision, not something that should slip in.
          count=$(go list -deps ./... | grep -vc '^\(internal/\|vendor/\|github.com/howlcipher/howlforge\)' || true)
          go list -m all
          direct=$(awk '/^require /,/^\)/' go.mod | grep -c 'gopkg.in/yaml.v3' || true)
          if [ "$direct" -ne 1 ]; then
            echo "expected exactly one direct dependency (gopkg.in/yaml.v3)"
            exit 1
          fi
          echo "dependency budget holds ($count resolved packages)"
